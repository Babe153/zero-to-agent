[project]
name = "zero-to-agent"
version = "0.1.0"
description = "Learn AI agent fundamentals through tool calling, agent loops, and multi-agent examples."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain>=1,<2",
    "langchain-classic>=1,<2",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
]

[tool.uv]
package = false
